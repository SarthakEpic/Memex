name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # The standalone server runs from .next, so CI must not rely on a
      # relative SQLite URL from .env. Every CI step shares this same file.
      DATABASE_URL: file:${{ runner.temp }}/memex-ci.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare environment
        run: |
          cp .env.example .env
          npx prisma generate
          npm run db:init-sqlite

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Smoke test
        run: npm run smoke
