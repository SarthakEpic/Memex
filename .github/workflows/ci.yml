name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare environment
        env:
          # Keep setup and standalone smoke on the same absolute SQLite file.
          DATABASE_URL: file:${{ github.workspace }}/prisma/db/ci-smoke.db
        run: |
          cp .env.example .env
          npx prisma generate
          npm run db:init-sqlite

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Smoke test
        env:
          DATABASE_URL: file:${{ github.workspace }}/prisma/db/ci-smoke.db
        run: npm run smoke
